<svg width="100%" viewBox="0 0 680 1198" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Full subagent chain — checkpoint-based resume, English</title>
<desc>A ticket goes through triage, a coder who always works on the ticket-numbered branch, a reviewer, and a UI tester. Failed reviews and failed tests route through a shared failure counter that tracks both attempt count and token budget. Once either limit is hit, the branch keeps its last validated checkpoint rather than resetting.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.node rect{fill:#1e1e1e;stroke:#555;}
.c-gray rect{fill:#2a2a2a;}
.c-pink rect{fill:#3a2430;}
.c-coral rect{fill:#3a2420;}
.c-blue rect{fill:#1f2a3a;}
.c-purple rect{fill:#2a2238;}
.c-teal rect{fill:#1f3530;}
.c-amber rect{fill:#3a3120;}
.th{fill:#eee;font:600 15px sans-serif;}
.ts{fill:#aaa;font:12px monospace;}
.arr{stroke:#888;stroke-width:0.5;}
</style>

<g class="node c-gray">
<rect x="260" y="20" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Task</text>
</g>
<line x1="340" y1="64" x2="340" y2="94" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="240" y="94" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="114" text-anchor="middle" dominant-baseline="central">Main session</text>
<text class="ts" x="340" y="134" text-anchor="middle" dominant-baseline="central">checks for checkpoint</text>
</g>
<line x1="340" y1="150" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>

<g class="node c-pink">
<rect x="190" y="180" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="200" text-anchor="middle" dominant-baseline="central">Ticket triage</text>
<text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">MCP: reads ticket</text>
</g>
<line x1="340" y1="236" x2="340" y2="246" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="285" y="246" width="110" height="20" rx="10" stroke-width="0.5"/><text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">hook</text></g>
<line x1="300" y1="266" x2="200" y2="286" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="266" x2="480" y2="286" class="arr" marker-end="url(#arrow)"/>

<g class="node c-pink">
<rect x="90" y="286" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="306" text-anchor="middle" dominant-baseline="central">Enough detail</text>
<text class="ts" x="200" y="326" text-anchor="middle" dominant-baseline="central">criteria + ticket -&gt; coder</text>
</g>
<g class="node c-coral">
<rect x="370" y="286" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="306" text-anchor="middle" dominant-baseline="central">Needs clarification</text>
<text class="ts" x="480" y="326" text-anchor="middle" dominant-baseline="central">posts comment, exits</text>
</g>

<path d="M200 342 L200 352 L340 352 L340 362" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)"/>

<g class="node c-blue">
<rect x="230" y="362" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="382" text-anchor="middle" dominant-baseline="central">Coder</text>
<text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">branch KAZ-112</text>
</g>
<line x1="340" y1="418" x2="340" y2="448" class="arr" marker-end="url(#arrow)"/>

<g class="node c-purple">
<rect x="190" y="448" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="468" text-anchor="middle" dominant-baseline="central">Hook: SubagentStop</text>
<text class="ts" x="340" y="488" text-anchor="middle" dominant-baseline="central">test check -&gt; checkpoint commit</text>
</g>
<line x1="340" y1="504" x2="340" y2="534" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
<rect x="210" y="534" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="554" text-anchor="middle" dominant-baseline="central">Reviewer</text>
<text class="ts" x="340" y="574" text-anchor="middle" dominant-baseline="central">diff + criteria vs ticket</text>
</g>
<line x1="340" y1="590" x2="340" y2="600" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="285" y="600" width="110" height="20" rx="10" stroke-width="0.5"/><text class="ts" x="340" y="610" text-anchor="middle" dominant-baseline="central">hook</text></g>
<line x1="300" y1="620" x2="200" y2="640" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="620" x2="480" y2="640" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
<rect x="90" y="640" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="660" text-anchor="middle" dominant-baseline="central">Review passed</text>
<text class="ts" x="200" y="680" text-anchor="middle" dominant-baseline="central">checkpoint, diff -&gt; tester</text>
</g>
<g class="node c-coral">
<rect x="370" y="640" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="660" text-anchor="middle" dominant-baseline="central">Needs fixes</text>
<text class="ts" x="480" y="680" text-anchor="middle" dominant-baseline="central">code fail -&gt; counter</text>
</g>

<path d="M200 696 L200 706 L340 706 L340 716" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)"/>

<g class="node c-amber">
<rect x="210" y="716" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="736" text-anchor="middle" dominant-baseline="central">UI tester</text>
<text class="ts" x="340" y="756" text-anchor="middle" dominant-baseline="central">screenshots per script</text>
</g>
<line x1="340" y1="772" x2="340" y2="782" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="285" y="782" width="110" height="20" rx="10" stroke-width="0.5"/><text class="ts" x="340" y="792" text-anchor="middle" dominant-baseline="central">hook</text></g>
<line x1="300" y1="802" x2="200" y2="822" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="802" x2="480" y2="822" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
<rect x="90" y="822" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="842" text-anchor="middle" dominant-baseline="central">Tests passed</text>
<text class="ts" x="200" y="862" text-anchor="middle" dominant-baseline="central">report -&gt; session</text>
</g>
<g class="node c-coral">
<rect x="370" y="822" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="842" text-anchor="middle" dominant-baseline="central">Tests failed</text>
<text class="ts" x="480" y="862" text-anchor="middle" dominant-baseline="central">screenshots -&gt; counter</text>
</g>

<path d="M200 878 L200 888 L340 888 L340 898" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="240" y="898" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="914" text-anchor="middle" dominant-baseline="central">Main session</text>
<text class="ts" x="340" y="932" text-anchor="middle" dominant-baseline="central">task complete</text>
</g>

<path d="M590 314 L660 314 L660 120 L442 120" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="664" y="220" text-anchor="start">↻</text>

<path d="M590 668 L650 668 L650 990 L440 990" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M590 850 L620 850 L620 952 L380 952 L380 962" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="240" y="962" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="982" text-anchor="middle" dominant-baseline="central">Failure counter</text>
<text class="ts" x="340" y="1002" text-anchor="middle" dominant-baseline="central">&lt;3 attempts &amp; budget?</text>
</g>
<line x1="300" y1="1018" x2="200" y2="1038" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="1018" x2="480" y2="1038" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
<rect x="90" y="1038" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="1058" text-anchor="middle" dominant-baseline="central">Continue</text>
<text class="ts" x="200" y="1078" text-anchor="middle" dominant-baseline="central">-&gt; coder</text>
</g>
<g class="node c-coral">
<rect x="370" y="1038" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="1058" text-anchor="middle" dominant-baseline="central">Limit reached</text>
<text class="ts" x="480" y="1078" text-anchor="middle" dominant-baseline="central">keep last checkpoint</text>
</g>

<path d="M90 1066 L70 1066 L70 390 L230 390" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="34" y="700" text-anchor="start">↻</text>

<path d="M480 1094 L480 1104 L340 1104 L340 1114" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="240" y="1114" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1130" text-anchor="middle" dominant-baseline="central">Main session</text>
<text class="ts" x="340" y="1148" text-anchor="middle" dominant-baseline="central">stopped</text>
</g>
</svg>
