<svg width="100%" viewBox="0 0 680 546" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Resume-or-restart decision made before entering the main chain</title>
<desc>When a ticket re-enters the queue, the main session first checks for an existing checkpoint. If none, work starts fresh at triage. If one exists, it checks whether the ticket changed or the main branch drifted since that checkpoint. If neither, work resumes after the checkpoint. If either changed, the stale state is archived and, as long as the restart cap in restarts.json hasn't been hit, work restarts fresh at triage; once the cap is hit, the chain stops permanently.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.node rect{fill:#1e1e1e;stroke:#555;}
.c-gray rect{fill:#2a2a2a;}
.c-pink rect{fill:#3a2430;}
.c-coral rect{fill:#3a2420;}
.c-teal rect{fill:#1f3530;}
.th{fill:#eee;font:600 15px sans-serif;}
.ts{fill:#aaa;font:12px monospace;}
.arr{stroke:#888;stroke-width:0.5;}
</style>

<g class="node c-gray">
<rect x="230" y="20" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Ticket re-enters queue</text>
</g>
<line x1="340" y1="64" x2="340" y2="94" class="arr" marker-end="url(#arrow)"/>

<g class="node c-pink">
<rect x="210" y="94" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="114" text-anchor="middle" dominant-baseline="central">Checkpoint exists?</text>
<text class="ts" x="340" y="134" text-anchor="middle" dominant-baseline="central">state/counter.json</text>
</g>
<line x1="300" y1="150" x2="200" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="150" x2="480" y2="170" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="90" y="170" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="192" text-anchor="middle" dominant-baseline="central">Start at triage</text>
</g>
<g class="node c-pink">
<rect x="370" y="170" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="192" text-anchor="middle" dominant-baseline="central">Checkpoint found</text>
</g>

<path d="M480 214 L480 224 L340 224 L340 234" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)"/>

<g class="node c-pink">
<rect x="190" y="234" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="254" text-anchor="middle" dominant-baseline="central">Ticket changed or main drifted?</text>
<text class="ts" x="340" y="274" text-anchor="middle" dominant-baseline="central">vs ticket-snapshot.md</text>
</g>
<line x1="300" y1="290" x2="200" y2="310" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="290" x2="480" y2="310" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
<rect x="90" y="310" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="330" text-anchor="middle" dominant-baseline="central">Resume after checkpoint</text>
<text class="ts" x="200" y="350" text-anchor="middle" dominant-baseline="central">skips one-time checks</text>
</g>
<g class="node c-coral">
<rect x="370" y="310" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="330" text-anchor="middle" dominant-baseline="central">Archive to stale/</text>
<text class="ts" x="480" y="350" text-anchor="middle" dominant-baseline="central">ticket-id/stale-&lt;ts&gt;/</text>
</g>

<path d="M480 366 L480 376 L340 376 L340 386" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="230" y="386" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">Restarts &lt; 2?</text>
<text class="ts" x="340" y="426" text-anchor="middle" dominant-baseline="central">restarts.json</text>
</g>
<line x1="300" y1="442" x2="200" y2="462" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="442" x2="480" y2="462" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
<rect x="90" y="462" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="484" text-anchor="middle" dominant-baseline="central">Restart allowed</text>
</g>
<g class="node c-coral">
<rect x="370" y="462" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="484" text-anchor="middle" dominant-baseline="central">Stopped, cap hit</text>
</g>

<path d="M90 484 L50 484 L50 192 L90 192" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
